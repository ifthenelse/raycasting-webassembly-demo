# CI is the authoritative gate. Pin actions to commit SHAs if your policy requires it.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/verify
      - run: npm audit --omit=dev --audit-level=high
